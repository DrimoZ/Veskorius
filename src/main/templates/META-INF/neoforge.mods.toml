modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"
# Icône de la liste des mods. Le fichier est produit par `node tools/logo/genlogo.js` et
# versionné dans src/main/resources — comme les textures, générées par le même genre d'outil.
logoFile="logo.png"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]] #optional
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
