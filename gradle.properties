# Mémoire allouée à Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environnement
# La version de Minecraft doit correspondre à la version de NeoForge ci-dessous.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Version NeoForge correspondant à 1.21.1. Vérifier la dernière version patch sur
# https://projects.neoforged.net/neoforged/neoforge si le build échoue.
neo_version=21.1.172
loader_version_range=[1,)

## Métadonnées du mod
mod_id=veskorius
mod_name=Veskorius
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.veskorius
# Non encore branché sur le template : une ligne `authors=""` vide dans le mods.toml
# afficherait « by  » dans la liste des mods. À renseigner ici ET à ajouter au template
# avant publication.
mod_authors=
# Texte affiché dans la liste des mods en jeu — une seule chaîne, non traduisible : en anglais,
# comme la page CurseForge et le wiki.
# PAS D'ACCENT ICI, ET CE N'EST PAS UN OUBLI : Gradle lit ce fichier en ISO-8859-1. Un « é »
# tapé directement ressort « Ã© » dans le mods.toml — constaté, pas supposé. Si un accent
# devient nécessaire un jour, il faudra l'écrire en \\u00e9 et vérifier le jar produit.
mod_description=Energy without a single cable. Wake a forgotten technology that fills the air \
  instead of running through wires.

## Dépendances de développement
# JEI (visualisation des recettes). Version NeoForge 1.21.1 présente dans le cache Gradle.
jei_version=19.21.0.247
# Jade (HUD au survol). NeoForge 1.21.1, via le maven Modrinth.
jade_version=15.10.5+neoforge
