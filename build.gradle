plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    // Dépôt de JEI (mezz.jei) et d'autres mods de l'écosystème.
    maven {
        name = "Jared's maven (JEI)"
        url = "https://maven.blamejared.com/"
    }
    // Modrinth — pour Jade (HUD d'informations de bloc au survol).
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang distribue Java 21 pour 1.21.x — le mod doit cibler Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Configurations de lancement par défaut. À garder telles quelles pour commencer.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // LA SUITE TOURNE EN DEUX PROCESSUS, ET C'EST LA SEULE FAÇON QU'ELLE FINISSE.
        //
        // Il n'y a plus de run « tout en un ». Il a existé, il a été mesuré, et il ne rend
        // jamais la main : les 158 tests passent — le bandeau se remplit, aucun « failed
        // at » — puis le serveur reste collé à 4,4 Go sans imprimer son résumé,
        // indéfiniment. Séparés, les MÊMES tests finissent proprement : 137 en 32 s dans
        // 2 Go, 21 en 17 s dans 4 Go. Ce qui sature n'est donc aucun test en particulier,
        // c'est ce qu'un processus ACCUMULE — et la seule borne est de ne pas tout mettre
        // dans le même. Le run unique a été SUPPRIMÉ plutôt que documenté comme fragile :
        // laisser en place une commande qui se bloque, c'est garantir qu'on la relance.
        //
        // Le filtrage passe par le NAMESPACE, seule prise offerte par GameTestServer — ni
        // par test, ni par classe, ni par motif. Les tests de structure ont donc le leur
        // (WorldGenTests.NAMESPACE), et leurs arènes sont générées sous les deux.
        //
        //   runFastGameTests   137 tests, 2 Go, ~30 s de tests. Le run de travail.
        //   runWorldGameTests   21 donjons, 4 Go, ~17 s. Dès qu'on touche aux structures.
        //   runAllGameTests    les deux, en deux JVM. Avant un commit.
        //
        // Reste incompressible : ~75 s de démarrage par processus (JVM, transformation de
        // classes NeoForge, monde). Aucune optimisation de test n'y touchera — la seule
        // réponse est de ne lancer que le sous-ensemble concerné.
        fastGameTests {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 2 Go suffisent parce que la pose de donjons, qui faisait le pic, est partie
            // dans l'autre run.
            jvmArguments.addAll '-Xmx2G', '-XX:+HeapDumpOnOutOfMemoryError'
        }
        // Les donjons seuls. À lancer dès qu'on touche à ModStructurePieceProvider ou à
        // Masonry — c'est là que se cache la salle murée, et aucun autre test ne la voit.
        worldGameTests {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'veskorius_world'
            jvmArguments.addAll '-Xmx4G', '-XX:+HeapDumpOnOutOfMemoryError'
        }
        data {
            data()
            // Génère automatiquement le JSON (blockstates, models, recettes, loot tables, etc.)
            // dans src/generated/resources/ à partir des DataProvider Java.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(), '--existing',
                file('src/main/resources/').getAbsolutePath()
        }
        // DEBUG sur les runs INTERACTIFS seulement. Les trois runs de test s'en passent :
        // ils tournent sans personne devant, et le marqueur REGISTRIES à lui seul déroule
        // chaque entrée de registre au démarrage. Quand un test tombe, c'est son message
        // d'assertion qu'on lit, jamais le journal de chargement.
        ['client', 'server', 'data'].each { name ->
            getByName(name) {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Le datagen met en cache les fichiers déjà écrits (HashCache). Or on édite
// parfois un JSON généré pour tester une recette en jeu (+ /reload) : un cache
// périmé conserverait alors cette édition manuelle au lieu de régénérer la valeur
// du code. On vide donc le cache avant chaque runData, pour que la sortie
// corresponde TOUJOURS aux DataProvider Java.
tasks.matching { it.name == 'runData' }.configureEach {
    doFirst {
        delete "${projectDir}/src/generated/resources/.cache"
    }
}

// LE MONDE DE TEST EST JETABLE, ET IL FAUT LE JETER.
//
// GameTestServer réutilise run/world d'un run à l'autre et y pose ses structures un peu
// plus loin à chaque fois. Rien ne les enlève : le monde avait atteint 1,4 Go et 1013
// fichiers de région. La suite ne devenait pas plus lourde — le monde, si.
//
// Le mode de panne est trompeur au point d'avoir fait accuser trois coupables successifs.
// Ce n'est pas un test qui échoue : le serveur passe des minutes AVANT le premier test,
// à charger et sauvegarder des régions, en crachant des barres de progression pleines,
// puis meurt en OutOfMemory. On voit un test lent, ou un serveur coincé, ou un tas trop
// petit — et on augmente -Xmx, ce qui repousse l'échéance et masque la cause. Deux fois.
//
// Un run de test doit partir d'un monde vide, sans quoi il mesure l'historique de la
// machine autant que le code.
// LA SUITE COMPLÈTE TOURNE EN DEUX JVM, PAS EN UNE.
//
// Mesuré : 137 tests passent en 32 s dans 2 Go, 21 tests de donjon en 17 s dans 4 Go, les
// deux processus sortant proprement. Les MÊMES 158 tests réunis dans une seule JVM collent
// à 4,4 Go et ne rendent jamais la main — tous les tests passent, le bandeau se remplit,
// mais le serveur n'imprime plus son résumé et tourne indéfiniment. Ce qui sature n'est
// donc pas un test en particulier : c'est ce qu'un run ACCUMULE, et la seule façon de le
// borner est de ne pas tout mettre dans le même processus.
//
// D'où cette tâche plutôt que runGameTestServer, qui reste disponible mais retombe dans
// le piège dès qu'on lui donne les deux namespaces.
tasks.register('runAllGameTests') {
    group = 'verification'
    description = 'Toute la suite, en deux processus : les tests rapides puis les donjons.'
    dependsOn 'runFastGameTests', 'runWorldGameTests'
}
tasks.matching { it.name == 'runWorldGameTests' }.configureEach {
    mustRunAfter 'runFastGameTests'
}

tasks.matching { it.name in ['runFastGameTests', 'runWorldGameTests'] }.configureEach {
    doFirst {
        delete "${projectDir}/run/world"
        // Les dumps de tas laissés par -XX:+HeapDumpOnOutOfMemoryError : 5 Go pièce,
        // et il y en avait deux. Utiles le temps d'un diagnostic, jamais après.
        delete fileTree("${projectDir}/run") { include '*.hprof' }
    }
}

// AUDIT DE COHÉRENCE, hors du jeu.
//
// Les GameTest ne voient ni src/generated ni veskorius-design : ils tournent dans le jar.
// Or la famille de panne la plus coûteuse de ce dépôt vit exactement là — un objet sans
// modèle, un bloc sans traduction, un inventaire qui annonce des chiffres faux. Rien ne
// plante ; on le découvre en jeu, ou jamais.
//
// L'audit est donc une tâche à part, et elle ÉCHOUE au lieu de prévenir.
tasks.register('audit', Exec) {
    group = 'verification'
    description = 'Vérifie registre ↔ ressources générées ↔ dossier de design.'
    commandLine 'node', 'tools/audit.js'
}

// JEI ET JADE NE SONT PLUS SUR LE CLASSPATH DES TESTS.
//
// Ils étaient en `localRuntime`, donc dans le runtimeClasspath de TOUS les runs — y
// compris le serveur de test, qui les chargeait à chaque lancement sans qu'aucun test ne
// les touche. Sur les cent trente-trois secondes d'un run rapide, soixante-sept étaient
// du chargement de mods.
//
// ModDevGradle donne à chaque run une configuration `<run>AdditionalRuntimeClasspath` :
// on les y met, pour le CLIENT seulement. L'API de JEI reste en compileOnly, donc le
// plugin compile et se vérifie toujours en jeu — mais les tests headless ne paient plus
// deux mods dont ils n'ouvrent jamais une classe.
dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    clientAdditionalRuntimeClasspath "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    clientAdditionalRuntimeClasspath "maven.modrinth:jade:${jade_version}"
}

// Génère neoforge.mods.toml à partir de src/main/templates/META-INF/neoforge.mods.toml
// en remplaçant les ${...} par les valeurs de gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
